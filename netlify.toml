[build]
  command = "SKIP_STORYGRAPH=true npx @11ty/eleventy"
  # TODO should the above more properly be moved to environment?
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "false"

[dev]
  # Skip the full Tumblr re-import so the server comes up before Netlify Dev times out.
  framework = "#custom"
  command = "npx @11ty/eleventy --serve"
  targetPort = 8080
